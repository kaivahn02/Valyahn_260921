<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파스텔 테트리스</title>
<style>
  :root {
    --bg: #2b2b3d;
    --panel: #ffffff;
    --border: #d9d9e3;
    --text: #3a3a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #cdeffd, #f7e1ff);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--text);
  }
  .game-wrap {
    display: flex;
    gap: 24px;
    background: var(--panel);
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  }
  canvas {
    background: #fdfdfe;
    border: 3px solid var(--border);
    border-radius: 10px;
    display: block;
  }
  .side-panel {
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .box {
    background: #f5f6fa;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .box h3 {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: #8b8ba7;
    letter-spacing: 1px;
  }
  .box .value {
    font-size: 24px;
    font-weight: bold;
  }
  #next-canvas {
    background: #fdfdfe;
    border: 2px solid var(--border);
    border-radius: 8px;
  }
  .controls {
    font-size: 12px;
    line-height: 1.6;
    color: #6a6a7d;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    border-radius: 10px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay button {
    padding: 8px 20px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    background: #b5ead7;
    color: #3a3a4a;
    cursor: pointer;
    font-weight: bold;
  }
  .overlay button:hover { background: #9fdcc4; }
  .board-area { position: relative; }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="board-area">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <button id="restart-btn">다시 시작</button>
    </div>
  </div>
  <div class="side-panel">
    <div class="box">
      <h3>NEXT</h3>
      <canvas id="next-canvas" width="120" height="120"></canvas>
    </div>
    <div class="box">
      <h3>SCORE</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="box">
      <h3>LEVEL</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="box">
      <h3>LINES</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="box controls">
      ← → : 이동<br>
      ↑ : 회전<br>
      ↓ : 소프트 드롭<br>
      Space : 하드 드롭<br>
      P : 일시정지
    </div>
  </div>
</div>

<script>
const COLS = 10;
const ROWS = 20;
const CELL = 30;

const boardCanvas = document.getElementById('board');
const ctx = boardCanvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const linesEl = document.getElementById('lines');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const restartBtn = document.getElementById('restart-btn');

// 파스텔톤 색상
const COLORS = {
  I: { fill: '#AEE1F9', stroke: '#7EC5EA' }, // 파스텔 블루
  O: { fill: '#FFF3B0', stroke: '#F5E08A' }, // 파스텔 옐로우
  T: { fill: '#E3C9F5', stroke: '#CFA3EA' }, // 파스텔 퍼플
  S: { fill: '#BDEFD0', stroke: '#98E0B6' }, // 파스텔 그린
  Z: { fill: '#FFC2C2', stroke: '#FFA0A0' }, // 파스텔 핑크레드
  J: { fill: '#C7D2FE', stroke: '#A9B8F5' }, // 파스텔 인디고
  L: { fill: '#FFD8B8', stroke: '#FFC091' }, // 파스텔 오렌지
};

const SHAPES = {
  I: [
    [[0,1],[1,1],[2,1],[3,1]],
  ],
  O: [
    [[0,0],[1,0],[0,1],[1,1]],
  ],
  T: [
    [[0,1],[1,1],[2,1],[1,0]],
  ],
  S: [
    [[1,0],[2,0],[0,1],[1,1]],
  ],
  Z: [
    [[0,0],[1,0],[1,1],[2,1]],
  ],
  J: [
    [[0,0],[0,1],[1,1],[2,1]],
  ],
  L: [
    [[2,0],[0,1],[1,1],[2,1]],
  ],
};

const TYPES = Object.keys(SHAPES);

function rotateCells(cells) {
  // 4x4 그리드 기준으로 시계방향 90도 회전: (x, y) -> (3 - y, x)
  return cells.map(([x, y]) => [3 - y, x]);
}

function createPiece(type) {
  const base = SHAPES[type][0].map(([x, y]) => [x, y]);
  return {
    type,
    cells: base,
    x: type === 'O' ? 4 : 3,
    y: -1,
  };
}

function randomType() {
  return TYPES[Math.floor(Math.random() * TYPES.length)];
}

let board = createEmptyBoard();
let current = createPiece(randomType());
let next = createPiece(randomType());
let score = 0;
let level = 1;
let lines = 0;
let dropInterval = 800;
let dropTimer = 0;
let lastTime = 0;
let gameOver = false;
let paused = false;
let animId = null;

function createEmptyBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function getAbsoluteCells(piece) {
  return piece.cells.map(([x, y]) => [piece.x + x, piece.y + y]);
}

function isValidPosition(piece, offsetX = 0, offsetY = 0, cells = null) {
  const targetCells = (cells || piece.cells).map(([x, y]) => [
    piece.x + x + offsetX,
    piece.y + y + offsetY,
  ]);
  for (const [x, y] of targetCells) {
    if (x < 0 || x >= COLS || y >= ROWS) return false;
    if (y >= 0 && board[y][x]) return false;
  }
  return true;
}

function lockPiece() {
  const cells = getAbsoluteCells(current);
  for (const [x, y] of cells) {
    if (y < 0) {
      triggerGameOver();
      return;
    }
    board[y][x] = current.type;
  }
  clearLines();
  current = next;
  next = createPiece(randomType());
  if (!isValidPosition(current)) {
    triggerGameOver();
  }
}

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (board[y].every((cell) => cell !== null)) {
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      y++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 60);
    updateInfo();
  }
}

function updateInfo() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  linesEl.textContent = lines;
}

function move(dx) {
  if (gameOver || paused) return;
  if (isValidPosition(current, dx, 0)) {
    current.x += dx;
    draw();
  }
}

function softDrop() {
  if (gameOver || paused) return;
  if (isValidPosition(current, 0, 1)) {
    current.y += 1;
    score += 1;
    updateInfo();
  } else {
    lockPiece();
  }
  dropTimer = 0;
  draw();
}

function hardDrop() {
  if (gameOver || paused) return;
  let dropDistance = 0;
  while (isValidPosition(current, 0, dropDistance + 1)) {
    dropDistance++;
  }
  current.y += dropDistance;
  score += dropDistance * 2;
  updateInfo();
  lockPiece();
  dropTimer = 0;
  draw();
}

function rotate() {
  if (gameOver || paused) return;
  if (current.type === 'O') return;
  const rotated = rotateCells(current.cells);

  const kicks = [0, -1, 1, -2, 2];
  for (const kick of kicks) {
    if (isValidPosition(current, kick, 0, rotated)) {
      current.cells = rotated;
      current.x += kick;
      draw();
      return;
    }
  }
}

function triggerGameOver() {
  gameOver = true;
  overlayTitle.textContent = 'Game Over';
  overlay.classList.add('show');
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  if (paused) {
    overlayTitle.textContent = '일시정지';
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }
}

function drawCell(context, x, y, type, cellSize) {
  const colors = COLORS[type];
  context.fillStyle = colors.fill;
  context.strokeStyle = colors.stroke;
  context.lineWidth = 2;
  const px = x * cellSize;
  const py = y * cellSize;
  const r = 6;
  context.beginPath();
  context.moveTo(px + r, py);
  context.arcTo(px + cellSize, py, px + cellSize, py + cellSize, r);
  context.arcTo(px + cellSize, py + cellSize, px, py + cellSize, r);
  context.arcTo(px, py + cellSize, px, py, r);
  context.arcTo(px, py, px + cellSize, py, r);
  context.closePath();
  context.fill();
  context.stroke();
}

function draw() {
  ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

  // 배경 그리드
  ctx.strokeStyle = '#eeeef5';
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, ROWS * CELL);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(COLS * CELL, y * CELL);
    ctx.stroke();
  }

  // 고정된 블록
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x]) {
        drawCell(ctx, x, y, board[y][x], CELL);
      }
    }
  }

  // 고스트 피스 (착지 위치 미리보기)
  let ghostY = 0;
  while (isValidPosition(current, 0, ghostY + 1)) ghostY++;
  ctx.globalAlpha = 0.25;
  for (const [x, y] of current.cells) {
    const gx = current.x + x;
    const gy = current.y + y + ghostY;
    if (gy >= 0) drawCell(ctx, gx, gy, current.type, CELL);
  }
  ctx.globalAlpha = 1;

  // 현재 조작 중인 블록
  for (const [x, y] of current.cells) {
    const px = current.x + x;
    const py = current.y + y;
    if (py >= 0) drawCell(ctx, px, py, current.type, CELL);
  }
}

function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const size = 26;
  const cells = next.cells;
  const minX = Math.min(...cells.map((c) => c[0]));
  const maxX = Math.max(...cells.map((c) => c[0]));
  const minY = Math.min(...cells.map((c) => c[1]));
  const maxY = Math.max(...cells.map((c) => c[1]));
  const w = (maxX - minX + 1) * size;
  const h = (maxY - minY + 1) * size;
  const offsetX = (nextCanvas.width - w) / 2 - minX * size;
  const offsetY = (nextCanvas.height - h) / 2 - minY * size;

  nextCtx.save();
  nextCtx.translate(offsetX, offsetY);
  for (const [x, y] of cells) {
    drawCell(nextCtx, x, y, next.type, size);
  }
  nextCtx.restore();
}

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  if (!gameOver && !paused) {
    dropTimer += delta;
    if (dropTimer > dropInterval) {
      if (isValidPosition(current, 0, 1)) {
        current.y += 1;
      } else {
        lockPiece();
      }
      dropTimer = 0;
    }
    draw();
    drawNext();
  }

  animId = requestAnimationFrame(loop);
}

function resetGame() {
  board = createEmptyBoard();
  current = createPiece(randomType());
  next = createPiece(randomType());
  score = 0;
  level = 1;
  lines = 0;
  dropInterval = 800;
  dropTimer = 0;
  lastTime = 0;
  gameOver = false;
  paused = false;
  overlay.classList.remove('show');
  updateInfo();
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      move(-1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      move(1);
      break;
    case 'ArrowDown':
      e.preventDefault();
      softDrop();
      break;
    case 'ArrowUp':
      e.preventDefault();
      rotate();
      break;
    case ' ':
      e.preventDefault();
      hardDrop();
      break;
    case 'p':
    case 'P':
      togglePause();
      break;
  }
});

restartBtn.addEventListener('click', resetGame);

updateInfo();
drawNext();
draw();
animId = requestAnimationFrame(loop);
</script>
</body>
</html>
